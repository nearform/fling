<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workshop quote</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Workshop quote</h1>
    <p id="hello">Checking who you are…</p>

    <form id="quote">
      <label>People <input name="people" type="number" min="1" max="200" value="12" required></label>
      <label>Days <input name="days" type="number" min="1" max="10" value="2" required></label>
      <label>Format
        <select name="format">
          <option value="remote">Remote</option>
          <option value="onsite">On site</option>
        </select>
      </label>
      <button>Price it</button>
    </form>

    <output id="result"></output>
    <button id="request" hidden>Ask the team to book it</button>
  </main>
  <script src="app.js" type="module"></script>
</body>
</html>
