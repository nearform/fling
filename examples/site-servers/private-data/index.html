<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trade prices</title>
  <style>
    body { font: 1rem/1.5 system-ui, sans-serif; margin: 0; display: grid; place-items: center; min-height: 100svh; }
    main { display: grid; gap: 1rem; width: min(30rem, 100% - 2rem); }
    form { display: grid; gap: 0.75rem; }
    label { display: grid; gap: 0.25rem; }
    output { font-size: 1.3rem; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <h1>Trade prices</h1>
    <form id="offer">
      <label>Product <select name="sku" id="sku"></select></label>
      <label>Quantity <input name="quantity" type="number" min="1" max="1000" value="25" required></label>
      <button>Get a trade price</button>
    </form>
    <output id="result"></output>
  </main>
  <script type="module">
    // The catalogue is a published file: the page reads it directly, like any visitor could.
    const { products } = await fetch('data/products.json').then(r => r.json())
    const select = document.querySelector('#sku')
    for (const p of products) select.add(new Option(`${p.name} (list £${p.listPrice})`, p.sku))

    const form = document.querySelector('#offer')
    const result = document.querySelector('#result')
    form.addEventListener('submit', async event => {
      event.preventDefault()
      const data = Object.fromEntries(new FormData(form))
      const res = await fetch('/api/offer', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ sku: data.sku, quantity: Number(data.quantity) }),
      })
      const offer = await res.json()
      result.textContent = res.ok
        ? `£${offer.unitPrice} each, £${offer.total.toLocaleString('en-GB')} for ${offer.quantity}`
        : offer.error
    })
  </script>
</body>
</html>
