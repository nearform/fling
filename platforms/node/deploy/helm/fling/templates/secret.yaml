{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fling.fullname" . }}
  labels:
    {{- include "fling.labels" . | nindent 4 }}
type: Opaque
stringData:
  SESSION_SECRET: {{ .Values.secrets.sessionSecret | required "secrets.sessionSecret (or secrets.existingSecret) is required" | quote }}
  SITE_HMAC_KEY: {{ .Values.secrets.siteHmacKey | required "secrets.siteHmacKey (or secrets.existingSecret) is required" | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | required "secrets.databaseUrl (or secrets.existingSecret) is required" | quote }}
  {{- with .Values.secrets.tickSecret }}
  TICK_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.s3AccessKeyId }}
  S3_ACCESS_KEY_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.s3SecretAccessKey }}
  S3_SECRET_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secrets.extra }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
