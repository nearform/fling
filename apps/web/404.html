<!DOCTYPE html>
<html lang="en" data-theme="fling-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <!-- The app's origin, filled in by the deploy (and the dev server); see not-found-main.tsx. -->
    <meta name="fling-app-origin" content="__APP_ORIGIN__" />

    <title>Not found · Fling</title>
    <meta name="theme-color" content="#161b2a" />
    <!-- Inlined: this page is served on site hosts, where no /favicon.svg exists. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2032%2032%22%3E%20%3Crect%20width=%2232%22%20height=%2232%22%20rx=%228%22%20fill=%22%235b5bd6%22/%3E%20%3Cpath%20d=%22M8.5%2023.5C11%2015%2015.5%2010.5%2023%209M17%207.8l6%201.2-1.6%205.9%22%20fill=%22none%22%20stroke=%22%23ffffff%22%20stroke-width=%223%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22/%3E%20%3C/svg%3E" />

    <!-- Apply the saved theme before React mounts so there is no flash. Only the two known
         theme names are accepted; anything else falls back to the OS preference so a stale
         value can never desync the toggle (ThemeToggle.tsx normalises the same way). -->
    <script>
      ;(function () {
        var saved = null
        try {
          saved = localStorage.getItem('theme')
        } catch (e) {}
        if (saved !== 'fling-light' && saved !== 'fling-dark') {
          saved =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'fling-dark'
              : 'fling-light'
        }
        document.documentElement.setAttribute('data-theme', saved)
      })()
    </script>
    <!-- Apply the instance's brand cached by the last visit (src/lib/instance.ts writes it), so
         there is no flash of the default theme. Only --brand-* hex colours and an http(s)/data:image
         favicon are accepted. -->
    <script>
      ;(function () {
        try {
          var b = JSON.parse(localStorage.getItem('fling-brand') || 'null')
          if (!b) return
          var vars = b.vars || {}
          for (var k in vars) {
            if (/^--brand-[a-z-]+$/.test(k) && /^#(?:[0-9a-f]{3}|[0-9a-f]{6})$/i.test(vars[k])) {
              document.documentElement.style.setProperty(k, vars[k])
            }
          }
          if (vars['--brand-ink']) {
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', vars['--brand-ink'])
          }
          var icon = document.querySelector('link[rel="icon"]')
          if (icon && typeof b.faviconUrl === 'string' && /^(https?:\/\/|data:image\/)/i.test(b.faviconUrl)) {
            icon.removeAttribute('type')
            icon.href = b.faviconUrl
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/not-found-main.tsx"></script>
  </body>
</html>
