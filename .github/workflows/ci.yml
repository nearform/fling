name: CI

# The quality gate, in one job: `pnpm gate` (lint, terraform, typecheck, test, build, and the e2e
# scenario on each platform's local runtime: apps/api's dev server, `wrangler dev` and the Node
# host), the same
# command a person runs before committing. The workflow adds no check of its own, so what passes
# here is exactly what passes on a laptop. It also installs terraform and helm, which the gate's
# Terraform and Helm checks only skip when they are missing outside CI.
#
# The one addition is local stand-ins for the cloud services: DynamoDB Local, MinIO, Postgres, the
# Cosmos DB emulator and Azurite as service containers, the Firestore emulator and fake-gcs-server
# started in a step, and the env vars that point the adapter conformance suites in platforms/aws,
# platforms/s3, platforms/node, platforms/gcp and platforms/azure at them. Without those env vars
# (a laptop without Docker) the suites skip, so `pnpm gate` still passes (the Postgres Table's
# suites still run on PGlite, in process); with them, the adapters must behave like the core's
# memory/fs ones. The tests create their own table, bucket, schemas and containers. To run them
# locally, see the `tests/services.ts` of platforms/aws, platforms/s3, platforms/node,
# platforms/gcp and platforms/azure.
#
# The Release workflow (release-cli.yml) calls it (workflow_call) on the tagged commit before
# publishing; a successful release then deploys. Every dependency is public, so no npm token is
# needed.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  # Cancel superseded runs on a PR branch, never on main or when called from a release.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.2
        ports: ['8000:8000']
      # bitnami's image starts the server by default (the official one needs `server /data`, and
      # service containers take no command).
      minio:
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        ports: ['9000:9000']
        env:
          MINIO_ROOT_USER: fling-test
          MINIO_ROOT_PASSWORD: fling-test-secret
        options: >-
          --health-cmd "curl -fs http://localhost:9000/minio/health/live"
          --health-interval 5s --health-timeout 5s --health-retries 12
      postgres:
        image: postgres:17
        ports: ['5432:5432']
        env:
          POSTGRES_PASSWORD: fling-test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      # The Cosmos DB Linux emulator (vNext, HTTP on 8081 by default) and Azurite for
      # platforms/azure. The emulator has no health command; its suites wait for it to answer.
      # Its only tag is a moving preview, so it is pinned by digest (the vnext-preview index).
      cosmos:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator@sha256:09dcd04e7149975f0427e6cb09781681f407fc74d01e54fc9d6410c36795cda3
        ports: ['8081:8081']
      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:3.38.0
        ports: ['10000:10000']
    env:
      FLING_TEST_DYNAMODB_ENDPOINT: http://localhost:8000
      FLING_TEST_S3_ENDPOINT: http://localhost:9000
      FLING_TEST_S3_ACCESS_KEY: fling-test
      FLING_TEST_S3_SECRET_KEY: fling-test-secret
      FLING_TEST_POSTGRES_URL: postgres://postgres:fling-test@localhost:5432/postgres
      FLING_TEST_FIRESTORE_EMULATOR_HOST: localhost:8086
      FLING_TEST_GCS_ENDPOINT: http://localhost:4443
      FLING_TEST_COSMOS_ENDPOINT: http://localhost:8081
      FLING_TEST_AZURITE_ENDPOINT: http://127.0.0.1:10000/devstoreaccount1
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from `packageManager` in the root package.json. Must precede setup-node
      # so `cache: pnpm` can find the store.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Firestore emulator and fake-gcs-server for platforms/gcp (tests/services.ts). Started
      # here rather than as service containers, which take no command, and both images need one.
      - name: Start the Google Cloud emulators
        run: |
          set -euo pipefail
          docker run -d --name firestore -p 8086:8080 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:594.0.0-emulators \
            gcloud emulators firestore start --host-port=0.0.0.0:8080
          docker run -d --name gcs -p 4443:4443 fsouza/fake-gcs-server:1.56.1 -scheme http -port 4443
          for i in $(seq 1 60); do
            curl -fs http://localhost:8086 >/dev/null && curl -fs http://localhost:4443/storage/v1/b >/dev/null && exit 0
            sleep 2
          done
          docker logs firestore; docker logs gcs
          echo "::error::the Google Cloud emulators did not start"; exit 1
      # For the Terraform part of the gate (scripts/check-terraform.mjs): ubuntu-24.04 runners don't
      # ship terraform. No wrapper: the script reads terraform's own output and exit code.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      # For the Helm part of the gate (scripts/check-helm.mjs): lint and template the charts.
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - run: pnpm gate
