name: Deploy

# Deploys Fling to AWS (the instance's account, provisioned by its own Terraform). Runs on every push
# to main once CI has passed on it, and by hand (workflow_dispatch) to redeploy or roll back to any
# earlier commit of main.
#
# Everything it needs is one repository variable, AWS_DEPLOY_CONFIG: the JSON of the stack's
# `deploy` output, plus an `INSTANCE` object with the instance's own values (INSTANCE_NAME,
# ALLOWED_EMAIL_DOMAINS and/or ALLOWED_EMAILS, BRAND_*…; shipped in lambda.zip as instance.json).
# The job assumes the app's deploy role over OIDC, which only trusts this repository's `production`
# environment, so there is no AWS key in GitHub. See platforms/aws/DEPLOY.md.
#
# Order, so nothing is ever served that points at something missing:
#   1. the API (Lambda code), and wait until the new code is live;
#   1b. data migrations: invoke the function with {"fling":"migrate"} until it reports done. The
#      code just deployed serves correctly before they run (each migration is written so; see
#      apps/api/src/migrations), so this comes after the code, never before. Needs
#      lambda:InvokeFunction on the deploy role and dynamodb:Scan on the function role
#      (platforms/aws/DEPLOY.md); without them the step warns and the deploy goes on, migrations pending;
#   1c. smoke test: the app origin's /.well-known/fling answers from the new code, for this instance;
#   2. the UI: hashed assets first and never deleted (open tabs keep loading their chunks), then the
#      other public files, then index.html last; plus the Claude Desktop extension at
#      downloads/fling.mcpb (built from apps/cli);
#   3. the sites' error page (_fling/404.html in the sites bucket, its __APP_ORIGIN__ filled in);
#   4. the site router (CloudFront Function, built by edge/build.mjs around the shared routing
#      decision in packages/shared/src/site-routing.ts): update, then publish to LIVE;
#   5. invalidate index.html on the app and _fling/* on the sites.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA (or ref) to deploy. Empty = the tip of the selected branch. Rollback = an older SHA of main.'
        type: string
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt an in-flight deploy

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to AWS
    # From workflow_run: only a successful CI run of a push to main (not a pull request's run).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    env:
      CONFIG: ${{ vars.AWS_DEPLOY_CONFIG }}
      SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref || github.sha }}
    steps:
      - name: Read the deploy config
        id: config
        run: |
          set -euo pipefail
          [ -n "$CONFIG" ] || { echo "::error::AWS_DEPLOY_CONFIG is not set (see platforms/aws/DEPLOY.md)"; exit 1; }
          get() { jq -er ".$1" <<<"$CONFIG"; }
          {
            for key in AWS_REGION AWS_DEPLOY_ROLE_ARN LAMBDA_FUNCTION UI_BUCKET SITES_BUCKET \
              SITE_ROUTER_FUNCTION APP_DISTRIBUTION_ID SITES_DISTRIBUTION_ID APP_ORIGIN; do
              echo "$key=$(get "$key")"
            done
            # The instance's own values, as env-style keys. Who may sign in (domains, individual
            # addresses, or both) has no default.
            jq -e '[.INSTANCE.ALLOWED_EMAIL_DOMAINS, .INSTANCE.ALLOWED_EMAILS] | map(strings | select(test("\\S"))) | length > 0' \
              <<<"$CONFIG" >/dev/null || {
              echo "::error::AWS_DEPLOY_CONFIG.INSTANCE needs ALLOWED_EMAIL_DOMAINS or ALLOWED_EMAILS (see platforms/aws/DEPLOY.md)"; exit 1; }
            echo "INSTANCE=$(jq -c '.INSTANCE' <<<"$CONFIG")"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      # Only ever ship code that is on main. A pull request's commits (including a fork's) can be
      # fetched by SHA, so a hand-run deploy with `ref` must not be able to ship unmerged code.
      - name: Check the commit is on main
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git merge-base --is-ancestor HEAD origin/main ||
            { echo "::error::$(git rev-parse HEAD) is not on main; only commits on main can be deployed"; exit 1; }

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `...` builds each package's workspace dependencies first.
      - name: Build the API, the web UI and the Claude Desktop extension
        env:
          # lambda.zip carries the instance's values as instance.json (platforms/aws/scripts/build.mjs).
          FLING_INSTANCE_CONFIG: ${{ steps.config.outputs.INSTANCE }}
          # The extension this instance serves defaults to this instance.
          FLING_MCPB_SERVER_URL: ${{ steps.config.outputs.APP_ORIGIN }}
        run: |
          set -euo pipefail
          pnpm --filter "@fling/platform-aws..." build
          pnpm --filter "@fling/web..." build
          # dist/site-router.js: the CloudFront Function, the shared routing decision bundled.
          pnpm --filter @fling/edge build
          # dist/fling.mcpb: the local MCP server bundled self-contained, validated and packed.
          pnpm --filter ./apps/cli build:mcpb
          for f in platforms/aws/dist/lambda.zip apps/web/dist/index.html apps/web/dist-404/404.html edge/dist/site-router.js apps/cli/dist/fling.mcpb; do
            [ -s "$f" ] || { echo "::error::build did not produce $f"; exit 1; }
          done

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ steps.config.outputs.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ steps.config.outputs.AWS_REGION }}

      - name: Deploy the API
        env:
          FUNCTION: ${{ steps.config.outputs.LAMBDA_FUNCTION }}
        run: |
          set -euo pipefail
          aws lambda update-function-code --function-name "$FUNCTION" \
            --zip-file fileb://platforms/aws/dist/lambda.zip --query CodeSha256 --output text
          aws lambda wait function-updated-v2 --function-name "$FUNCTION"

      # Each invoke runs migration pages until shortly before the function's timeout, checkpoints
      # and returns the runner's report; call again until `done`. `busy` means another run holds
      # a migration's lock (a crashed one's lease runs out within 2 minutes).
      - name: Run data migrations
        env:
          FUNCTION: ${{ steps.config.outputs.LAMBDA_FUNCTION }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/migrate.json"
          for attempt in $(seq 1 40); do
            # Missing permissions (the deploy role's lambda:InvokeFunction, or the function role's
            # dynamodb:Scan) leave the migrations pending, which the code tolerates: warn, go on.
            not_allowed() {
              echo "::warning::Data migrations NOT run: $1 (platforms/aws/DEPLOY.md, Data migrations). The API works meanwhile; grant it and redeploy."
              echo "### Data migrations not run: $1" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            }
            if ! meta="$(aws lambda invoke --function-name "$FUNCTION" \
              --cli-binary-format raw-in-base64-out --payload '{"fling":"migrate"}' \
              --cli-read-timeout 0 "$out" 2>&1)"; then
              grep -q AccessDenied <<<"$meta" && not_allowed "the deploy role lacks lambda:InvokeFunction"
              echo "$meta"; exit 1
            fi
            if jq -e '.FunctionError' <<<"$meta" >/dev/null; then
              grep -q AccessDenied "$out" && not_allowed "the function role lacks dynamodb:Scan on the table"
              echo "::error::The migrate invoke failed"; cat "$out"; exit 1
            fi
            jq -r '.migrations[] | "\(.id) \(.title): \(.status), \(.scanned) items, \(.counts)"' "$out"
            if jq -e '.done' "$out" >/dev/null; then
              jq -r '.migrations[] | "- \(.id) \(.title): \(.status)"' "$out" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if jq -e 'any(.migrations[]; .status == "busy")' "$out" >/dev/null; then sleep 20; fi
          done
          echo "::error::Data migrations still not done after 40 invocations"; exit 1

      # The new code answers for this instance before anything points at it (the function can only
      # start with a valid instance config, e.g. ALLOWED_EMAIL_DOMAINS).
      - name: Smoke test the API
        env:
          APP_ORIGIN: ${{ steps.config.outputs.APP_ORIGIN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if meta="$(curl -fsS -H 'Cache-Control: no-cache' "$APP_ORIGIN/.well-known/fling?deploy=$SHA")" &&
              jq -e --arg origin "$APP_ORIGIN" '.version >= 1 and .appOrigin == $origin' <<<"$meta" >/dev/null; then
              jq -c '{name, appOrigin, sitesDomain, auth: .auth.kind}' <<<"$meta"
              exit 0
            fi
            sleep 6
          done
          echo "::error::$APP_ORIGIN/.well-known/fling did not answer for this instance (check the function's logs)"; exit 1

      - name: Upload the UI
        env:
          BUCKET: ${{ steps.config.outputs.UI_BUCKET }}
        run: |
          set -euo pipefail
          cd apps/web/dist
          # Content-hashed: cached for a year, never deleted (tabs on the previous release need them).
          if [ -d assets ]; then
            aws s3 sync assets "s3://$BUCKET/assets/" --size-only --no-progress \
              --cache-control "public, max-age=31536000, immutable"
          fi
          # Everything else but index.html (favicon, logo...): short cache, removed when gone.
          # downloads/ is uploaded below, not from the web build, so the sync must not delete it.
          aws s3 sync . "s3://$BUCKET/" --no-progress --delete \
            --exclude 'assets/*' --exclude 'downloads/*' --exclude index.html \
            --cache-control "public, max-age=300"
          # The Claude Desktop extension: https://<app>/downloads/fling.mcpb (has an extension, so
          # the SPA function serves it from the bucket as is).
          aws s3 cp ../../cli/dist/fling.mcpb "s3://$BUCKET/downloads/fling.mcpb" --no-progress \
            --content-type "application/octet-stream" \
            --content-disposition 'attachment; filename="fling.mcpb"' \
            --cache-control "public, max-age=300"
          # Last, so it only ever points at files that are already there.
          aws s3 cp index.html "s3://$BUCKET/index.html" --no-progress \
            --content-type "text/html; charset=utf-8" --cache-control "no-cache"

      - name: Upload the sites' error page
        env:
          BUCKET: ${{ steps.config.outputs.SITES_BUCKET }}
          APP_ORIGIN: ${{ steps.config.outputs.APP_ORIGIN }}
        run: |
          set -euo pipefail
          # The page links home and brands itself from the app origin's /.well-known/fling.
          page="$RUNNER_TEMP/404.html"
          sed -e "s#__APP_ORIGIN__#${APP_ORIGIN}#g" apps/web/dist-404/404.html > "$page"
          if grep -q '__APP_ORIGIN__' "$page"; then
            echo "::error::placeholder left in the 404 page"; exit 1
          fi
          # no-store: a browser that hits the 404 in the seconds before a new site (or share link)
          # reaches the edge must not keep showing it once the site is there.
          aws s3 cp "$page" "s3://$BUCKET/_fling/404.html" --no-progress \
            --content-type "text/html; charset=utf-8" --cache-control "no-store"

      - name: Publish the site router
        env:
          FUNCTION: ${{ steps.config.outputs.SITE_ROUTER_FUNCTION }}
          APP_ORIGIN: ${{ steps.config.outputs.APP_ORIGIN }}
        run: |
          set -euo pipefail
          code="$RUNNER_TEMP/site-router.js"
          scheme="${APP_ORIGIN%%://*}"
          sed -e "s#__APP_ORIGIN__#${APP_ORIGIN}#g" -e "s#__SITE_SCHEME__#${scheme}#g" \
            edge/dist/site-router.js > "$code"
          if grep -q '__APP_ORIGIN__\|__SITE_SCHEME__' "$code"; then
            echo "::error::placeholders left in the site router"; exit 1
          fi
          # UpdateFunction replaces the whole configuration: send back the current one (comment,
          # runtime, KeyValueStore association, all owned by Terraform) with only the code changed.
          described="$(aws cloudfront describe-function --name "$FUNCTION" --stage DEVELOPMENT)"
          etag="$(jq -er .ETag <<<"$described")"
          jq '.FunctionSummary.FunctionConfig | {Comment: (.Comment // ""), Runtime, KeyValueStoreAssociations}' \
            <<<"$described" > "$RUNNER_TEMP/function-config.json"
          etag="$(aws cloudfront update-function --name "$FUNCTION" --if-match "$etag" \
            --function-config "file://$RUNNER_TEMP/function-config.json" \
            --function-code "fileb://$code" --query ETag --output text)"
          # Run the new code in CloudFront's own runtime before it goes LIVE: it accepts less than
          # Node does (e.g. no await inside call arguments), and an error there takes every site down.
          host="deploy-check-${SHA:0:7}.$(jq -r .sitesDomain <<<"$(curl -fsS "$APP_ORIGIN/.well-known/fling")")"
          jq -n --arg host "$host" '{version: "1.0", context: {eventType: "viewer-request"},
            viewer: {ip: "192.0.2.1"}, request: {method: "GET", uri: "/", querystring: {},
            headers: {host: {value: $host}}, cookies: {}}}' > "$RUNNER_TEMP/event.json"
          result="$(aws cloudfront test-function --name "$FUNCTION" --if-match "$etag" \
            --stage DEVELOPMENT --event-object "fileb://$RUNNER_TEMP/event.json" --output json)"
          error="$(jq -r '.TestResult.FunctionErrorMessage // ""' <<<"$result")"
          if [ -n "$error" ]; then
            echo "::error::The site router fails in CloudFront, not published: $error"; exit 1
          fi
          jq -r '"site router test: \(.TestResult.FunctionOutput), utilization \(.TestResult.ComputeUtilization)%"' <<<"$result"
          aws cloudfront publish-function --name "$FUNCTION" --if-match "$etag" \
            --query FunctionSummary.Status --output text

      - name: Invalidate
        env:
          APP_DISTRIBUTION: ${{ steps.config.outputs.APP_DISTRIBUTION_ID }}
          SITES_DISTRIBUTION: ${{ steps.config.outputs.SITES_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          # Every client-side route is served as /index.html (the SPA function), so this is all of them.
          aws cloudfront create-invalidation --distribution-id "$APP_DISTRIBUTION" \
            --paths /index.html / --query Invalidation.Id --output text
          aws cloudfront create-invalidation --distribution-id "$SITES_DISTRIBUTION" \
            --paths '/_fling/*' --query Invalidation.Id --output text
          echo "### Deployed \`$SHA\` to ${{ steps.config.outputs.APP_ORIGIN }}" >> "$GITHUB_STEP_SUMMARY"
