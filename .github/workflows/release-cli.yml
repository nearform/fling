name: Release CLI

# Publishes the CLI, @nearform/fling, to public npm when a `cli-v<version>` tag is pushed:
#
#   # bump apps/cli/package.json, merge, then on that commit:
#   git tag cli-v0.2.0 && git push origin cli-v0.2.0
#
# The tag must match apps/cli/package.json's version. The gate (ci.yml) runs on the tagged commit
# first. `pnpm pack` writes the tarball (it rewrites any workspace: ranges), `npm publish` uploads it.
#
# Publishing uses npm trusted publishing (OIDC): no npm token is stored in GitHub. On npmjs.com,
# @nearform/fling → Settings → Trusted publishing trusts GitHub Actions, nearform/fling,
# workflow `release-cli.yml`. npm exchanges this job's OIDC token for a short-lived publish
# credential and adds provenance automatically (public repo + public package). Needs npm >= 11.5.1.
on:
  push:
    tags: ['cli-v*']

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish @nearform/fling
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#cli-v}"
          version="$(jq -er .version apps/cli/package.json)"
          [ "$tag" = "$version" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match apps/cli/package.json version $version"; exit 1; }

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter "@nearform/fling..." build

      - name: Pack
        id: pack
        working-directory: apps/cli
        run: |
          set -euo pipefail
          pnpm pack --pack-destination "$RUNNER_TEMP"
          tarball="$(ls "$RUNNER_TEMP"/nearform-fling-*.tgz)"
          tar -tzf "$tarball" | grep -q '^package/dist/cli.js$' || { echo "::error::dist/cli.js missing from $tarball"; exit 1; }
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      # Trusted publishing needs npm >= 11.5.1; don't depend on the version bundled with Node.
      - name: Update npm
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Publish
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public
